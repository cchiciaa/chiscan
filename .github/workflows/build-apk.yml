name: Build Android APK (v1.0_dev)

on:
  push:
    branches:
      - v1.0_dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Android APK
        working-directory: apps/mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiscan-v1.0_dev-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0_dev
          target_commitish: v1.0_dev
          name: ChiScan v1.0_dev
          prerelease: true
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
